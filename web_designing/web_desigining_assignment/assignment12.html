<!DOCTYPE html>
<html lang="en">
<head>
    <title>HTML Table</title>
</head>
<body>

    <h1>Student Information Table</h1>

    <table border="1">

        <caption>Student Details</caption>

        <thead>
            <tr>
                <th>Roll No.</th>
                <th>Name</th>
                <th>Course</th>
                <th>Marks</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>Rahul</td>
                <td>BCA</td>
                <td>85</td>
            </tr>

            <tr>
                <td>2</td>
                <td>Priya</td>
                <td>BBA</td>
                <td>90</td>
            </tr>

            <tr>
                <td>3</td>
                <td>Amit</td>
                <td>BCA</td>
                <td>80</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">Total Students</td>
                <td>3</td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
