<!DOCTYPE html>
<html lang="en">
<head>
    <title>Semantic and Non-Semantic Elements</title>
</head>
<body>

    <h1>Semantic and Non-Semantic Elements</h1>

    <h2>Semantic Elements</h2>

    <header>
        <h2>My Website</h2>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <main>
        <section>
            <h2>About HTML</h2>
            <p>HTML is used to create web pages.</p>
        </section>

        <article>
            <h2>My First Article</h2>
            <p>This is an example of an article element.</p>
        </article>
    </main>

    <footer>
        <p>Copyright &copy; 2026 My Website</p>
    </footer>

    <h2>Non-Semantic Elements</h2>

    <div>
        <p>This is a div element.</p>
    </div>

    <span>This is a span element.</span>

</body>
</html>
