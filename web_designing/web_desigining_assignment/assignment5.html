<!DOCTYPE html>
<html lang="en">
<head>
    <title>HTML Lists</title>
</head>
<body>

    <h1>HTML Lists</h1>

    <h2>Unordered List</h2>

    <ul>
        <li>Apple</li>
        <li>Mango</li>
        <li>Banana</li>
        <li>Orange</li>
    </ul>

    <h2>Ordered List</h2>

    <ol>
        <li>Wake up</li>
        <li>Take a bath</li>
        <li>Have breakfast</li>
        <li>Go to college</li>
    </ol>
<!-- Description list contains terms and their details -->
    <h2>Description List</h2>

    <dl>
        <dt>HTML</dt>
        <dd>HTML is used to create web pages.</dd>

        <dt>CSS</dt>
        <dd>CSS is used to design web pages.</dd>

        <dt>JavaScript</dt>
        <dd>JavaScript makes web pages interactive.</dd>
    </dl>

</body>
</html>
