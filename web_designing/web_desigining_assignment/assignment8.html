<!DOCTYPE html>
<html lang="en">
<head>
    <title>Hyperlinks and Images</title>
</head>
<body>

    <h1>Hyperlinks and Images</h1>

    <h2>Hyperlinks</h2>

    <p>Visit Google using the link below:</p>

    <a href="https://www.google.com" target="_blank">
        Open Google
    </a>

    <p>Visit YouTube:</p>

    <a href="https://www.youtube.com" target="_blank">
        Open YouTube
    </a>
<!-- Image element uses src, alt, width and height attributes -->
    <h2>Images</h2>

    <p>Here is an example of an image:</p>

    <img src="https://via.placeholder.com/300"
         alt="Sample placeholder image"
         width="300"
         height="200">

    <p>This image has width, height and alt attributes.</p>

</body>
</html>
