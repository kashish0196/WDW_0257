<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Timetable</title>
</head>
<body>

    <h1>Student Weekly Timetable</h1>

    <table border="1">

        <caption>Class Timetable</caption>

        <tr>
            <th>Day</th>
            <th>9 AM - 10 AM</th>
            <th>10 AM - 11 AM</th>
            <th>11 AM - 12 PM</th>
        </tr>

        <tr>
            <th>Monday</th>
            <td>HTML</td>
            <td>CSS</td>
            <td rowspan="2">Practical</td>
        </tr>

        <tr>
            <th>Tuesday</th>
            <td>Python</td>
            <td>C++</td>
        </tr>

        <tr>
            <th>Wednesday</th>
            <td colspan="2">Web Designing Workshop</td>
            <td>Maths</td>
        </tr>
<!-- Colspan is used to merge two columns -->
        <tr>
            <th>Thursday</th>
            <td>English</td>
            <td>HTML</td>
            <td>Python</td>
        </tr>

    </table>

</body>
</html>
