<!DOCTYPE html>
<html lang="en">
<head>
    <title>Accessibility in HTML</title>
</head>
<body>

    <h1>Accessibility in HTML</h1>

    <h2>Image with Alternative Text</h2>

    <img src="https://via.placeholder.com/250"
         alt="A sample image"
         width="250"
         height="150">

    <h2>Accessible Form</h2>

    <form>
        <label for="name">Enter Your Name:</label>
        <input type="text" id="name" name="name">

        <br><br>

        <label for="email">Enter Your Email:</label>
        <input type="email" id="email" name="email">

        <br><br>

        <button type="submit">Submit</button>
    </form>

    <h2>Accessible Link</h2>

    <a href="https://www.google.com">
        Visit Google Website
    </a>
<!-- Accessibility makes websites easier for everyone to use -->
    <h2>Accessibility Information</h2>

    <p>
        Accessibility helps all people use websites easily.
        Alt text, labels and clear links make websites
        more accessible.
    </p>

</body>
</html>
