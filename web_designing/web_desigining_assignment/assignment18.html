<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Admission Form</title>
</head>
<body>

    <header>
        <h1>Student Admission Form</h1>
        <p>Welcome to our college admission page.</p>
    </header>

    <main>

        <form action="#" method="post">

            <fieldset>
                <legend>Personal Details</legend>

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your name" required>

                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>

                <br><br>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone"
                       pattern="[0-9]{10}"
                       placeholder="10 digit number" required>

                <br><br>

                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>

                <br><br>

                <label for="gender">Gender:</label>
                <select id="gender" name="gender">
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>

            </fieldset>

            <br>

            <fieldset>
                <legend>Academic Details</legend>

                <label for="course">Choose Course:</label>
                <select id="course" name="course" required>
                    <option value="">Select Course</option>
                    <option value="BCA">BCA</option>
                    <option value="BBA">BBA</option>
                    <option value="BTech">B.Tech</option>
                    <option value="MCA">MCA</option>
                </select>

                <br><br>

                <label for="qualification">Previous Qualification:</label>
                <input type="text" id="qualification"
                       name="qualification" required>

                <br><br>

                <label for="marks">Previous Marks (%):</label>
                <input type="number" id="marks" name="marks"
                       min="0" max="100" required>

            </fieldset>

            <br>

            <fieldset>
                <legend>Address Details</legend>

                <label for="address">Full Address:</label>
                <br>

                <textarea id="address" name="address"
                          rows="4" cols="30"
                          placeholder="Enter your address"
                          required></textarea>

            </fieldset>

            <br>

            <input type="checkbox" id="agree" name="agree" required>
            <label for="agree">
                I confirm that the information is correct.
            </label>

            <br><br>

            <button type="submit">Submit Application</button>
            <button type="reset">Reset Form</button>

        </form>

    </main>
<!-- Footer displays the copyright information -->
    <footer>
        <p>Copyright &copy; 2026 Student Admission Page</p>
    </footer>

</body>
</html>
