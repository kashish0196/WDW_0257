<!DOCTYPE html>
<html lang="en">
<head>
    <title>Nested and Responsive Tables</title>

    <style>
        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>

    <h1>Nested and Responsive Tables</h1>

    <h2>Nested Table</h2>

    <table>
        <tr>
            <th>Student Name</th>
            <th>Details</th>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>
                <table>
                    <tr>
                        <th>Course</th>
                        <th>Year</th>
                    </tr>
                    <tr>
                        <td>BCA</td>
                        <td>First</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <h2>Responsive Table</h2>

    <div class="table-container">
        <table>
            <tr>
                <th>Roll No.</th>
                <th>Name</th>
                <th>Course</th>
                <th>Marks</th>
            </tr>

            <tr>
                <td>1</td>
                <td>Priya</td>
                <td>BCA</td>
                <td>85</td>
            </tr>

            <tr>
                <td>2</td>
                <td>Amit</td>
                <td>BBA</td>
                <td>90</td>
            </tr>

            <tr>
                <td>3</td>
                <td>Neha</td>
                <td>BCA</td>
                <td>88</td>
            </tr>
        </table>
    </div>

</body>
</html>
