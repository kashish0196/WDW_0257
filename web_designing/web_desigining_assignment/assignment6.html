<!DOCTYPE html>
<html lang="en">
<head>
    <title>Nested and Mixed Lists</title>
</head>
<body>

    <h1>Nested and Mixed Lists</h1>

    <h2>Nested List</h2>

    <ul>
        <li>Fruits
            <ul>
                <li>Apple</li>
                <li>Mango</li>
                <li>Banana</li>
            </ul>
        </li>

        <li>Vegetables
            <ul>
                <li>Potato</li>
                <li>Tomato</li>
                <li>Carrot</li>
            </ul>
        </li>
    </ul>
<!-- Mixed list combines ordered and unordered lists -->
    <h2>Mixed List</h2>

    <ol>
        <li>Subjects
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
            </ul>
        </li>

        <li>Programming Languages
            <ul>
                <li>Python</li>
                <li>C++</li>
            </ul>
        </li>
    </ol>

</body>
</html>
