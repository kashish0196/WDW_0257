<!DOCTYPE html>
<html lang="en">
<head>
    <title>Block and Inline Elements</title>
</head>
<body>

    <h1>Block and Inline Elements</h1>

    <h2>Block Elements</h2>

    <div>
        <h3>My First Block Element</h3>
        <p>This is a paragraph.</p>
    </div>

    <div>
        <p>This is another block element.</p>
    </div>

    <h2>Inline Elements</h2>

    <p>
        This is <b>bold text</b> inside a paragraph.
    </p>

    <p>
        This is <i>italic text</i> inside a paragraph.
    </p>

    <p>
        Visit <a href="https://www.google.com">Google</a>
        for more information.
    </p>

</body>
</html>
